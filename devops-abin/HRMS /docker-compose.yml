
name: myapp

services:

  # ==========================================================
  # Java backend
  # ==========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: myapp-backend:local

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080

      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75.0
        -XX:InitialRAMPercentage=25.0
        -XX:+ExitOnOutOfMemoryError

    expose:
      - "8080"

    networks:
      - app-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080${BACKEND_HEALTH_PATH:-/actuator/health} >/dev/null || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

    mem_limit: 1g
    cpus: "1.0"

    security_opt:
      - no-new-privileges:true


  # ==========================================================
  # React frontend
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-/api}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}

    image: myapp-frontend:local

    restart: unless-stopped

    expose:
      - "8080"

    networks:
      - app-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    mem_limit: 256m
    cpus: "0.50"

    security_opt:
      - no-new-privileges:true


  # ==========================================================
  # Public reverse proxy
  # ==========================================================
  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine-slim

    restart: unless-stopped

    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8080

      FRONTEND_HOST: frontend
      FRONTEND_PORT: 8080

    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

    ports:
      - "${HOST_HTTP_PORT:-80}:8080"

    networks:
      - app-network

    depends_on:
      backend:
        condition: service_healthy

      frontend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    mem_limit: 256m
    cpus: "0.50"

    security_opt:
      - no-new-privileges:true


networks:

  app-network:
    driver: bridge